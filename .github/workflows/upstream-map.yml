name: upstream-map

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Accept a lower merged count than the last run (e.g. a repo was deleted)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/upstream-map.yml"]
  pull_request:
    paths: ["scripts/**", "tests/**", ".github/workflows/upstream-map.yml"]

permissions:
  contents: write

concurrency:
  group: upstream-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Fetch and render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then flags="--check"; fi
          if [ "${{ inputs.allow_shrink }}" = "true" ]; then flags="$flags --allow-shrink"; fi
          python3 scripts/upstream_map.py --login sasmith-14 $flags

      - name: Commit if changed
        if: github.event_name != 'pull_request'
        run: |
          git add README.md assets/ data/
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update Upstream Map"
          git push
